name = "kopidlenska-drbna"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Vlastní doména. Hlavní adresa je www.kopidlenskadrbna.org, kopidlenskadrbna.org na ni přesměruje
# (hostRedirect v src/http.js). popelnice.kopidlenskadrbna.org zatím zůstává u starého webu: až se má
# přesměrovat na /popelnice (umí to taky hostRedirect), přidat sem i její řádek.
routes = [
  { pattern = "kopidlenskadrbna.org", custom_domain = true },
  { pattern = "www.kopidlenskadrbna.org", custom_domain = true }
]
# Stará adresa *.workers.dev zatím jen přesměruje na www (hostRedirect). Až nebude potřeba, dát workers_dev = false.
# Náhledy verzí (preview_urls) jsou vypnuté: běží nad stejnou D1, ať redakce není ještě na další adrese.
workers_dev = true
preview_urls = false

# Chat s Drběnou a přihlášení do redakce: Turnstile (ověření, že píše člověk) zapnou tajemství TURNSTILE_SITE_KEY
# a TURNSTILE_SECRET z widgetu Turnstile v Cloudflare (npx wrangler secret put …). Bez nich chrání chat i přihlášení
# jen limity.
#
# Uzavírky z Dopravního info (NDIC): NDIC_PUSH_USER a NDIC_PUSH_PASSWORD jsou jméno a heslo, kterým se NDIC
# hlásí na /ndic/uzavirky (stejné se zadají u odběru v portálu mobilitydata.rsd.cz). Bez nich je příjem vypnutý.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kopidlenska-drbna"
database_id = "6b49d75b-58bf-433d-91be-1869f543a388"

# E-maily (kód pro přihlášení do redakce) přes Cloudflare Email Service. Doména kopidlenskadrbna.org musí být
# v Email Service přidaná pro odesílání, jinak Cloudflare e-mail odmítne a do redakce se nikdo nepřihlásí.
# Odesílá se z redakce@kopidlenskadrbna.org (src/mail.js). Místně e-mail nikam nejde, Wrangler ho jen vypíše.
[[send_email]]
name = "EMAIL"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kopidlenska-drbna"

[triggers]
crons = ["15 */4 * * *"]
