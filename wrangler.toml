name = "kopidlenska-drbna"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Cloudflare Access: ACCESS_TEAM (název týmu, třeba „drbna“ z drbna.cloudflareaccess.com) a ACCESS_AUD
# (Application Audience tag) se nastavují jako tajemství: npx wrangler secret put ACCESS_TEAM
# Místně nejsou, takže náhled a vývoj se dál přihlašují heslem.
#
# Chat s Drběnou: Turnstile (ověření, že píše člověk) zapnou tajemství TURNSTILE_SITE_KEY a TURNSTILE_SECRET
# z widgetu Turnstile v Cloudflare (npx wrangler secret put …). Bez nich chat chrání jen limity z redakce.
#
# Uzavírky z Dopravního info (NDIC): NDIC_PUSH_USER a NDIC_PUSH_PASSWORD jsou jméno a heslo, kterým se NDIC
# hlásí na /ndic/uzavirky (stejné se zadají u odběru v portálu mobilitydata.rsd.cz). Bez nich je příjem vypnutý.
# Cloudflare Access na tuhle adresu nesmí (NDIC se přes Access nepřihlásí): hlídat jen /redakce.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kopidlenska-drbna"
database_id = "6b49d75b-58bf-433d-91be-1869f543a388"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kopidlenska-drbna"

[triggers]
crons = ["15 */4 * * *"]

# Až drbna pojede na vlastní doméně: odkomentovat routes a přidat workers_dev = false a preview_urls = false
# nahoru k name, ať redakce nejde obejít kolem Cloudflare Access.
# routes = [
#   { pattern = "kopidlenskadrbna.org", custom_domain = true },
#   { pattern = "www.kopidlenskadrbna.org", custom_domain = true },
#   { pattern = "popelnice.kopidlenskadrbna.org", custom_domain = true }
# ]
